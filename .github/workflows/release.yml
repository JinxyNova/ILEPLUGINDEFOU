name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate.py
      - name: Zip datapack
        run: |
          cd datapack
          zip -r "../iles-du-chaos-${GITHUB_REF_NAME}.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          files: iles-du-chaos-*.zip
          generate_release_notes: true
